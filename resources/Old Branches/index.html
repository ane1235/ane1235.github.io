  <script>
  


  
  function escHtml(str) {
    if (!str) return '';
    return str.toString()
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  
  function showToast(msg) {
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function() { toast.classList.remove("show"); }, 2000);
  }

  
  function parseTime(str) {
    if (!str) return null;
    str = str.trim();
    var match = str.match(/(\d{1,2}):(\d{2})/);
    if (!match) return null;
    var h = parseInt(match[1]);
    var m = parseInt(match[2]);
    return { h: h, m: m, total: h * 60 + m };
  }

  
  function updateTimeHighlight() {
    document.querySelectorAll(".time-highlight").forEach(function(el) {
      el.classList.remove("time-highlight");
    });

    var now = new Date();
    var nowMinutes = now.getHours() * 60 + now.getMinutes();

    
    
    
    
    

    document.querySelectorAll("[data-time]").forEach(function(el) {
      var timeStr = el.getAttribute("data-time");
      var range = timeStr.split(/[\–-]/);
      if (range.length < 2) return;

      var start = parseTime(range[0]);
      var end = parseTime(range[1]);
      if (start && end && nowMinutes >= start.total && nowMinutes < end.total) {
        el.classList.add("time-highlight");
      }
    });
  }

  
  
  
  
  function getRoomFromSectionTitle(title) {
    if (!title) return "\—";
    
    if (title.match(/Room\s*1\s*[&]\s*2/) || title.indexOf("공통") >= 0) {
      return "공통";
    }
    
    if (title.match(/Room\s*1/i)) return "Room 1";
    
    if (title.match(/Room\s*2/i)) return "Room 2";
    return "\—";
  }

  
  
  
  function parseSessionData(tabName, rawData) {
    var sections = [];
    var currentSection = null;

    for (var i = 0; i < rawData.length; i++) {
      var row = rawData[i];
      var cell0 = (row[0] || "").toString().trim();
      var cell1 = (row[1] || "").toString().trim();
      var cell2 = (row[2] || "").toString().trim();

      if (!cell0 && !cell1 && !cell2) continue;
      if (cell0.indexOf("📅") === 0) continue;

      
      if (cell0.indexOf("Session") === 0) {
        var room = getRoomFromSectionTitle(cell0);
        currentSection = { title: cell0, chair: null, room: room, items: [] };
        sections.push(currentSection);
        continue;
      }

      if (cell0 === "시간" && cell1 === "제목") continue;

      
      if (cell0.indexOf("좌장") === 0) {
        if (currentSection) currentSection.chair = cell0;
        continue;
      }

      if (!currentSection) continue;

      
      if (cell0 && cell0.match(/\d{1,2}:\d{2}/)) {
        var isEvent = isEventRow(cell1);
        currentSection.items.push({
          id: tabName + "_R" + i,
          time: cell0,
          title: cell1,
          speaker: cell2,
          selectable: !isEvent && !!cell1 && !!cell2,
          rowIndex: i,
          room: currentSection.room  
        });
      }
    }

    return sections;
  }

  
  function isEventRow(title) {
    if (!title) return true;
    var keywords = ["토론", "Discussion", "런천", "휴식", "폐회", "총회", "개회"];
    for (var k = 0; k < keywords.length; k++) {
      if (title.indexOf(keywords[k]) >= 0) return true;
    }
    return false;
  }

  
  
  function getLectureDataById(lectureId) {
    var lastR = lectureId.lastIndexOf("_R");
    if (lastR < 0) return null;

    var tabName = lectureId.substring(0, lastR);
    var rowIdx = parseInt(lectureId.substring(lastR + 2));

    if (!state.appData.sessions[tabName]) return null;
    var rawData = state.appData.sessions[tabName];
    var row = rawData[rowIdx];
    if (!row) return null;

    
    
    var room = "\—";
    for (var i = rowIdx; i >= 0; i--) {
      var cellCheck = (rawData[i][0] || "").toString().trim();
      if (cellCheck.indexOf("Session") === 0) {
        room = getRoomFromSectionTitle(cellCheck);
        break;
      }
    }

    return {
      id: lectureId,
      tab: tabName,
      time: (row[0] || "").toString().trim(),
      title: (row[1] || "").toString().trim(),
      speaker: (row[2] || "").toString().trim(),
      room: room
    };
  }

  
  function formatSessionCell(text) {
    if (!text) return '';
    return escHtml(text).replace(/\n/g, '<br>');
  }

  
  function isBreakRow(text) {
    if (!text) return true;
    var keywords = ["휴식", "폐회"];
    for (var i = 0; i < keywords.length; i++) {
      if (text.indexOf(keywords[i]) >= 0) return true;
    }
    return false;
  }

  
  function findTabForOverviewRow(timeStr, sessionText, rowIdx) {
    var match = sessionText.match(/Session\s+(\d+)/);
    if (match) {
      var sNum = parseInt(match[1]);
      var sMap = { 1:"Day1_A1", 2:"Day1_A1", 3:"Day1_P1", 4:"Day1_P2", 5:"Day1_P2",
                   6:"Day1_P3", 7:"Day1_P3", 8:null, 9:"Day2_A1", 10:"Day2_A1",
                   11:"Day2_P1", 12:"Day2_P1", 13:"Day2_P2", 14:"Day2_P2" };
      return sMap[sNum] || null;
    }
    if (sessionText.indexOf("런천 세션 1") >= 0 || sessionText.indexOf("런천 세션 2") >= 0) return "Day1_A1";
    if (sessionText.indexOf("런천 세션 3") >= 0 || sessionText.indexOf("런천 세션 4") >= 0) return "Day2_A1";
    return null;
  }

  
  function findMatchingSlot(lectureTime, slots) {
    var lecStart = parseTime(lectureTime.split(/[\–-]/)[0]);
    if (!lecStart) return null;

    for (var i = 0; i < slots.length; i++) {
      var range = slots[i].time.split(/[\–-]/);
      var slotStart = parseTime(range[0]);
      var slotEnd = parseTime(range[1]);
      if (slotStart && slotEnd && lecStart.total >= slotStart.total && lecStart.total < slotEnd.total) {
        return slots[i].time;
      }
    }
    return null;
  }
</script>  <script>
  


  
  // ============================================================
  // API 설정 — Apps Script 웹앱 URL (fetch API로 호출)
  // ============================================================
  // 이 URL은 Apps Script "배포 관리"에서 확인 가능.
  // 수정 후 "새 버전" 배포 시 URL은 변경되지 않지만, 캐시 주의.
  var API_URL = 'https://script.google.com/macros/s/AKfycbySQil2bfJ-Iicws05I7fFvbZbmmcSR1-BKjMlhg8i0pozBhJWo06b5h0p_DcIdaq3v/exec';

  // ============================================================
  // callApi(params) — GET 요청 헬퍼
  // ============================================================
  // Apps Script는 302 리다이렉트를 거치므로 redirect:'follow' 필수.
  // params = { action: 'login', name: '홍길동', sn2: '12345678' }
  // 반환: Promise → JSON 객체
  function callApi(params) {
    var url = API_URL + '?' + Object.keys(params).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');

    return fetch(url, { redirect: 'follow' })
      .then(function(res) { return res.json(); });
  }

  // ============================================================
  // callApiPost(body) — POST 요청 헬퍼
  // ============================================================
  // Content-Type을 text/plain으로 보내야 CORS preflight 없이 통과.
  // (application/json은 preflight 발생 → Apps Script에서 OPTIONS 미지원)
  // body = { action: 'saveSelections', sn2: '12345678', selections: [...] }
  function callApiPost(body) {
    return fetch(API_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body)
    }).then(function(res) { return res.json(); });
  }

  // ============================================================
  // 전역 상태 객체
  // ============================================================
  var state = {
    user: null,           // 로그인된 사용자 정보
    appData: null,        // 전체 학회 데이터
    selections: [],       // 선택한 강좌 ID 배열
    currentView: "login", // 현재 뷰 이름
    currentTab: null,     // 현재 세션 탭
    mypageDay: 1,         // MyPage 표시 Day
    highlightTimer: null  // 현재시간 하이라이트 타이머
  };

  
  function handleLoginSubmit() {
    var name = document.getElementById("input-name").value.trim();
    var sn2 = document.getElementById("input-sn2").value.trim();
    var errorEl = document.getElementById("login-error");

    if (!name || !sn2) {
      errorEl.textContent = "이름과 사번을 모두 입력해주세요.";
      errorEl.classList.remove("hidden");
      return;
    }

    errorEl.classList.add("hidden");

    
    // fetch API로 로그인 요청 (GET)
    callApi({ action: 'login', name: name, sn2: sn2 })
      .then(onLoginSuccess)
      .catch(function(err) {
        errorEl.textContent = "서버 연결 오류: " + err.message;
        errorEl.classList.remove("hidden");
      });
  }

  
  function onLoginSuccess(result) {
    var errorEl = document.getElementById("login-error");
    if (result.success) {
      state.user = result.data;
      initApp();
    } else {
      errorEl.textContent = result.error || "로그인에 실패했습니다.";
      errorEl.classList.remove("hidden");
    }
  }

  
  function initApp() {
    document.getElementById("view-login").classList.add("hidden");
    document.getElementById("app-container").classList.remove("hidden");
    document.getElementById("user-display").textContent = state.user.name;
    loadAppData();
  }

  
  function loadAppData() {
    var loaded = { data: false, sel: false };

    
    // fetch API로 전체 데이터 조회 (GET)
    callApi({ action: 'getAllData' })
      .then(function(result) {
        if (result.success) {
          state.appData = result.data;
          buildDropdownMenus();
        }
        loaded.data = true;
        if (loaded.data && loaded.sel) onAllDataReady();
      })
      .catch(function(err) {
        showToast("데이터 로드 실패: " + err.message);
        loaded.data = true;
        if (loaded.data && loaded.sel) onAllDataReady();
      });

    // fetch API로 강좌 선택 목록 조회 (GET)
    callApi({ action: 'getSelections', sn2: state.user.sn2 })
      .then(function(result) {
        if (result.success) {
          state.selections = result.data || [];
        }
        loaded.sel = true;
        if (loaded.data && loaded.sel) onAllDataReady();
      })
      .catch(function(err) {
        state.selections = [];
        loaded.sel = true;
        if (loaded.data && loaded.sel) onAllDataReady();
      });
  }

  
  function onAllDataReady() {
    showView("overview");
    updateTimeHighlight();
    state.highlightTimer = setInterval(updateTimeHighlight, 60000);
  }

  
  function handleLogout() {
    if (state.highlightTimer) clearInterval(state.highlightTimer);
    state.user = null;
    state.appData = null;
    state.selections = [];
    state.currentView = "login";

    document.getElementById("app-container").classList.add("hidden");
    document.getElementById("view-login").classList.remove("hidden");
    document.getElementById("input-name").value = "";
    document.getElementById("input-sn2").value = "";
    document.getElementById("login-error").classList.add("hidden");
  }

  
  function toggleLecture(lectureId) {
    var idx = state.selections.indexOf(lectureId);
    if (idx >= 0) {
      state.selections.splice(idx, 1);
    } else {
      state.selections.push(lectureId);
    }

    
    var el = document.querySelector('[data-id="' + lectureId + '"]');
    if (el) {
      var isNowSelected = state.selections.indexOf(lectureId) >= 0;
      el.classList.toggle("selected", isNowSelected);
      var icon = el.querySelector(".select-indicator");
      if (icon) icon.textContent = isNowSelected ? "check_circle" : "radio_button_unchecked";
    }

    
    // fetch API로 강좌 선택 저장 (POST)
    callApiPost({
      action: 'saveSelections',
      sn2: state.user.sn2,
      selections: state.selections
    })
      .then(function(result) {
        if (!result.success) showToast("저장 실패: " + (result.error || ""));
      })
      .catch(function(err) {
        showToast("저장 오류: " + err.message);
      });

    showToast(idx >= 0 ? "선택 해제됨" : "선택 완료");
  }
</script>
  <script>
  


  
  function buildDropdownMenus() {
    if (!state.appData || !state.appData.menuMap) return;
    var map = state.appData.menuMap;

    
    var dd1 = document.getElementById("dropdown-day1");
    dd1.innerHTML = "";
    if (map.DAY1) {
      map.DAY1.forEach(function(item) {
        var div = document.createElement("div");
        div.className = "dropdown-item";
        div.textContent = item.label;
        div.onclick = function(e) {
          e.stopPropagation();
          closeAllDropdowns();
          showView("session", item.tab);
        };
        dd1.appendChild(div);
      });
    }

    
    var dd2 = document.getElementById("dropdown-day2");
    dd2.innerHTML = "";
    if (map.DAY2) {
      map.DAY2.forEach(function(item) {
        var div = document.createElement("div");
        div.className = "dropdown-item";
        div.textContent = item.label;
        div.onclick = function(e) {
          e.stopPropagation();
          closeAllDropdowns();
          showView("session", item.tab);
        };
        dd2.appendChild(div);
      });
    }
  }

  
  function toggleDropdown(id) {
    var menu = document.getElementById("dropdown-" + id);
    var isOpen = menu.classList.contains("show");
    closeAllDropdowns();
    if (!isOpen) menu.classList.add("show");
  }

  function closeAllDropdowns() {
    document.querySelectorAll(".dropdown-menu").forEach(function(el) {
      el.classList.remove("show");
    });
  }

  
  document.addEventListener("click", function(e) {
    if (!e.target.closest(".nav-item")) closeAllDropdowns();
  });

  
  
  
  function showView(viewName, param) {
    state.currentView = viewName;
    var area = document.getElementById("content-area");

    
    document.querySelectorAll(".nav-item").forEach(function(el) { el.classList.remove("active"); });

    switch (viewName) {
      case "overview":
        area.innerHTML = '<div class="view-container">' + renderOverview() + '</div>';
        break;
      case "session":
        state.currentTab = param;
        area.innerHTML = '<div class="view-container">' + renderSession(param) + '</div>';
        if (param && param.startsWith("Day1")) document.getElementById("nav-day1").classList.add("active");
        if (param && param.startsWith("Day2")) document.getElementById("nav-day2").classList.add("active");
        break;
      case "mypage":
        area.innerHTML = '<div class="view-container">' + renderMyPage() + '</div>';
        document.getElementById("nav-mypage").classList.add("active");
        break;
      default:
        area.innerHTML = '<div class="view-container">' + renderOverview() + '</div>';
    }

    updateTimeHighlight();
    window.scrollTo(0, 0);
  }
</script>
  <script>
  


  
  
  
  function renderOverview() {
    if (!state.appData || !state.appData.overview) {
      return '<p class="text-center py-10 text-gray-500">데이터를 불러올 수 없습니다.</p>';
    }

    var rows = state.appData.overview;
    var html = '';

    html += '<div class="text-center mb-6">';
    html += '<h2 class="text-2xl font-bold text-primary-dark">' + escHtml(rows[0][0] || '') + '</h2>';
    html += '<p class="text-sm text-gray-500 mt-1">' + escHtml(rows[1] ? rows[1][0] : '') + '</p>';
    html += '</div>';

    html += '<table class="overview-table">';

    for (var i = 2; i < rows.length; i++) {
      var row = rows[i];
      var cell0 = (row[0] || "").toString();
      var cell1 = (row[1] || "").toString();
      var cell2 = (row[2] || "").toString();

      if (!cell0 && !cell1 && !cell2) continue;

      if (cell0.indexOf("📅") === 0) {
        html += '<tr class="day-header"><td colspan="3">' + escHtml(cell0) + '</td></tr>';
        continue;
      }

      if (cell0 === "시간") {
        html += '<tr><th>' + escHtml(cell0) + '</th><th>' + escHtml(cell1) + '</th>';
        if (cell2) html += '<th>' + escHtml(cell2) + '</th>';
        html += '</tr>';
        continue;
      }

      if (cell0.indexOf("일시:") === 0 || cell0.indexOf("사전등록비") === 0) {
        html += '<tr><td colspan="3" class="text-xs text-gray-500" style="background:#f8fafc;">' + escHtml(cell0) + '</td></tr>';
        continue;
      }

      var isBreak = isBreakRow(cell1);
      var isClickable = !isBreak && cell1.indexOf("Session") >= 0;
      var tabName = isClickable ? findTabForOverviewRow(cell0, cell1, i) : null;
      var hasRoom2 = !!cell2;
      var timeAttr = cell0 ? ' data-time="' + escHtml(cell0) + '"' : '';

      if (isBreak) {
        html += '<tr class="break-row"' + timeAttr + '>';
        html += '<td>' + escHtml(cell0) + '</td>';
        html += '<td' + (hasRoom2 ? '' : ' colspan="2"') + '>' + escHtml(cell1) + '</td>';
        if (hasRoom2) html += '<td>' + escHtml(cell2) + '</td>';
        html += '</tr>';
      } else if (isClickable) {
        html += '<tr class="clickable" onclick="onOverviewRowClick(\\'' + (tabName || '') + '\\')"' + timeAttr + '>';
        html += '<td>' + escHtml(cell0) + '</td>';
        html += '<td' + (hasRoom2 ? '' : ' colspan="2"') + '>' + formatSessionCell(cell1) + '</td>';
        if (hasRoom2) html += '<td>' + formatSessionCell(cell2) + '</td>';
        html += '</tr>';
      } else {
        html += '<tr' + timeAttr + '>';
        html += '<td>' + escHtml(cell0) + '</td>';
        html += '<td' + (hasRoom2 ? '' : ' colspan="2"') + '>' + escHtml(cell1) + '</td>';
        if (hasRoom2) html += '<td>' + escHtml(cell2) + '</td>';
        html += '</tr>';
      }
    }

    html += '</table>';

    var ev = state.appData.event;
    html += '<div class="text-center text-xs text-gray-400 mt-4">';
    html += escHtml(ev.VENUE) + ' | ' + escHtml(ev.DATE_DAY1) + ' ~ ' + escHtml(ev.DATE_DAY2);
    html += '</div>';

    return html;
  }

  function onOverviewRowClick(tabName) {
    if (tabName) showView("session", tabName);
  }


  
  
  
  function renderSession(tabName) {
    if (!state.appData || !state.appData.sessions || !state.appData.sessions[tabName]) {
      return '<p class="text-center py-10 text-gray-500">세션 데이터를 찾을 수 없습니다.</p>';
    }

    var rawData = state.appData.sessions[tabName];
    var sections = parseSessionData(tabName, rawData);
    var html = '';

    if (rawData.length > 0 && rawData[0][0]) {
      html += '<div class="text-center mb-4">';
      html += '<h3 class="text-lg font-bold text-primary-dark">' + escHtml(rawData[0][0]) + '</h3>';
      html += '</div>';
    }

    for (var s = 0; s < sections.length; s++) {
      var sec = sections[s];
      html += '<div class="session-section">';
      html += '<div class="session-header">' + escHtml(sec.title) + '</div>';

      if (sec.chair) {
        html += '<div class="session-chair"><span class="material-icons mr-1" style="font-size:16px; color:#2563eb;">person</span>' + escHtml(sec.chair) + '</div>';
      }

      for (var l = 0; l < sec.items.length; l++) {
        var item = sec.items[l];
        if (item.selectable) {
          var isSelected = state.selections.indexOf(item.id) >= 0;
          html += '<div class="lecture-row' + (isSelected ? ' selected' : '') + '" data-id="' + item.id + '" data-time="' + escHtml(item.time) + '" onclick="toggleLecture(\\'' + item.id + '\\')">';
          html += '<span class="material-icons select-indicator">' + (isSelected ? 'check_circle' : 'radio_button_unchecked') + '</span>';
          html += '<div class="lec-time">' + escHtml(item.time) + '</div>';
          html += '<div class="lec-title">' + escHtml(item.title) + '</div>';
          html += '<div class="lec-speaker">' + escHtml(item.speaker) + '</div>';
          html += '</div>';
        } else {
          html += '<div class="event-row" data-time="' + escHtml(item.time) + '">';
          html += '<div class="lec-time">' + escHtml(item.time) + '</div>';
          html += '<div class="lec-title">' + escHtml(item.title) + '</div>';
          html += '<div class="lec-speaker">' + escHtml(item.speaker || '') + '</div>';
          html += '</div>';
        }
      }

      html += '</div>';
    }

    return html;
  }


  
  
  
  function renderMyPage() {
    var html = '';

    html += '<div class="text-center mb-4">';
    html += '<h3 class="text-lg font-bold text-primary-dark"><span class="material-icons mr-1" style="vertical-align:middle;">bookmark</span>내 강좌</h3>';
    html += '<p class="text-sm text-gray-500">' + escHtml(state.user.name) + '님의 선택 강좌</p>';
    html += '</div>';

    html += '<div class="mypage-tabs">';
    html += '<div class="mypage-tab' + (state.mypageDay === 1 ? ' active' : '') + '" onclick="switchMypageDay(1)">Day 1 (4/11 토)</div>';
    html += '<div class="mypage-tab' + (state.mypageDay === 2 ? ' active' : '') + '" onclick="switchMypageDay(2)">Day 2 (4/12 일)</div>';
    html += '</div>';

    html += renderMyPageDay(state.mypageDay);

    html += '<div class="overlap-legend">';
    html += '<span class="material-icons" style="font-size:16px; color:#dc2626;">warning</span>';
    html += ' <span class="overlap-legend-swatch"></span> = 같은 시간대 다른 Room 중복 선택 (동시 수강 불가)';
    html += '</div>';

    return html;
  }

  function switchMypageDay(dayNum) {
    state.mypageDay = dayNum;
    showView("mypage");
  }

  function renderMyPageDay(dayNum) {
    if (!state.appData) return '';

    var slots = getOverviewSlots(dayNum);
    var grouped = groupSelectionsBySlot(dayNum, slots);

    var html = '<table class="my-table">';
    html += '<tr><th style="width:110px;">세션 시간</th><th style="width:70px;">Room</th><th style="width:100px;">강좌시간</th><th>주제</th><th style="width:150px;">연자/소속</th></tr>';

    if (slots.length === 0) {
      html += '<tr><td colspan="5" class="text-center py-8 text-gray-400">해당 일정이 없습니다.</td></tr>';
      html += '</table>';
      return html;
    }

    var hasAny = false;
    var totalOverlaps = 0;

    for (var s = 0; s < slots.length; s++) {
      var slot = slots[s];
      var lectures = grouped[slot.time] || [];

      if (lectures.length === 0) {
        html += '<tr class="slot-row" data-time="' + escHtml(slot.time) + '">';
        html += '<td>' + escHtml(slot.time) + '</td>';
        html += '<td colspan="4" class="text-gray-300 text-center">\—</td>';
        html += '</tr>';
      } else {
        hasAny = true;

        
        var overlapIds = getOverlappingIds(lectures);
        var hasOverlapInSlot = Object.keys(overlapIds).length > 0;
        if (hasOverlapInSlot) totalOverlaps++;

        
        if (hasOverlapInSlot) {
          html += '<tr class="overlap-group-start"><td colspan="5"></td></tr>';
        }

        for (var l = 0; l < lectures.length; l++) {
          var lec = lectures[l];
          
          var isOverlapping = overlapIds[lec.id] === true;
          var rowClass = isOverlapping ? 'overlap-row' : '';

          html += '<tr class="' + rowClass + '" data-time="' + escHtml(lec.time) + '">';

          
          if (l === 0) {
            html += '<td' + (lectures.length > 1 ? ' rowspan="' + lectures.length + '"' : '') + ' class="font-semibold text-primary-dark align-top">' + escHtml(slot.time) + '</td>';
          }

          
          var roomBadgeClass = 'room-badge';
          if (lec.room === 'Room 1') roomBadgeClass += ' room-1';
          else if (lec.room === 'Room 2') roomBadgeClass += ' room-2';
          else roomBadgeClass += ' room-common';
          html += '<td><span class="' + roomBadgeClass + '">' + escHtml(lec.room) + '</span></td>';

          html += '<td class="text-sm">' + escHtml(lec.time) + '</td>';
          html += '<td>' + escHtml(lec.title) + '</td>';
          html += '<td class="text-sm text-gray-500">' + escHtml(lec.speaker) + '</td>';
          html += '</tr>';
        }

        
        if (hasOverlapInSlot) {
          html += '<tr class="overlap-group-end"><td colspan="5">';
          html += '<span class="material-icons" style="font-size:14px; color:#dc2626; vertical-align:middle;">warning</span>';
          html += ' <span class="text-xs text-red-600">시간이 겹치는 다른 Room 강좌가 있습니다. 하나를 선택해주세요.</span>';
          html += '</td></tr>';
        }
      }
    }

    if (!hasAny) {
      html += '<tr><td colspan="5" class="text-center py-4 text-gray-400 text-sm">세션 페이지에서 강좌를 선택해주세요.</td></tr>';
    }

    html += '</table>';

    if (hasAny) {
      var overlapMsg = totalOverlaps > 0 ? ' | <span class="text-red-500">⚠ 시간 중복 ' + totalOverlaps + '건</span>' : '';
      html += '<p class="text-xs text-gray-400 mt-2 text-center">선택한 강좌: ' + state.selections.length + '개' + overlapMsg + '</p>';
    }

    return html;
  }

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  function getOverlappingIds(lectures) {
    var overlapIds = {};

    if (lectures.length < 2) return overlapIds;

    for (var i = 0; i < lectures.length; i++) {
      for (var j = i + 1; j < lectures.length; j++) {
        var a = lectures[i];
        var b = lectures[j];

        
        
        if (a.room === b.room) continue;

        
        
        if (a.room === "공통" || b.room === "공통") continue;
        if (a.room === "\—" || b.room === "\—") continue;

        
        var aRange = a.time.split(/[\–-]/);
        var bRange = b.time.split(/[\–-]/);

        if (aRange.length < 2 || bRange.length < 2) continue;

        var aStart = parseTime(aRange[0]);
        var aEnd = parseTime(aRange[1]);
        var bStart = parseTime(bRange[0]);
        var bEnd = parseTime(bRange[1]);

        if (!aStart || !aEnd || !bStart || !bEnd) continue;

        
        
        
        
        
        
        
        if (aStart.total < bEnd.total && bStart.total < aEnd.total) {
          overlapIds[a.id] = true;
          overlapIds[b.id] = true;
        }
      }
    }

    return overlapIds;
  }


  
  
  

  function getOverviewSlots(dayNum) {
    var rows = state.appData.overview;
    var slots = [];
    var inTargetDay = false;

    for (var i = 0; i < rows.length; i++) {
      var cell0 = (rows[i][0] || "").toString();
      var cell1 = (rows[i][1] || "").toString();

      if (cell0.indexOf("📅 Day " + dayNum) >= 0) { inTargetDay = true; continue; }
      if (cell0.indexOf("📅 Day") >= 0 && inTargetDay) { break; }

      if (!inTargetDay) continue;
      if (cell0 === "시간" || !cell0) continue;
      if (cell0.indexOf("일시:") === 0 || cell0.indexOf("사전등록비") === 0) continue;

      if (cell1.indexOf("Session") >= 0 || cell1.indexOf("런천") >= 0) {
        slots.push({ time: cell0, label: cell1 });
      }
    }

    return slots;
  }

  function groupSelectionsBySlot(dayNum, slots) {
    var grouped = {};
    var dayPrefix = "Day" + dayNum + "_";

    slots.forEach(function(slot) { grouped[slot.time] = []; });

    state.selections.forEach(function(selId) {
      if (selId.indexOf(dayPrefix) !== 0) return;

      var lecData = getLectureDataById(selId);
      if (!lecData) return;

      var matchedSlot = findMatchingSlot(lecData.time, slots);
      if (matchedSlot && grouped[matchedSlot]) {
        grouped[matchedSlot].push(lecData);
      }
    });

    
    Object.keys(grouped).forEach(function(key) {
      grouped[key].sort(function(a, b) {
        var timeCmp = a.time.localeCompare(b.time);
        if (timeCmp !== 0) return timeCmp;
        if (a.room === "Room 1" && b.room === "Room 2") return -1;
        if (a.room === "Room 2" && b.room === "Room 1") return 1;
        return 0;
      });
    });

    return grouped;
  }
</script>
