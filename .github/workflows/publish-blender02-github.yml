name: Publish Blender 02 GitHub video
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-blender02-github.yml]
permissions:
  contents: write
concurrency:
  group: publish-blender02-github
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message != 'Remove completed Blender 02 transfer workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Download verified GPU video and player
        shell: python
        run: |
          import hashlib, pathlib, urllib.request
          files = [{'name': '261005_codex_blender_sj_v01_100MB_h265.mp4', 'path': 'report/mov/261005_uav_codex-blender_sj/261005_codex_blender_sj_v01_100MB_h265.mp4', 'bytes': 86525669, 'sha256': '0e635e2e04ab65308a879ea2861dd8629ea83b5a07afcde9b4514bbc07f7ae99'}, {'name': 'index.html', 'path': 'report/mov/261005_uav_codex-blender_sj/index.html', 'bytes': 12020, 'sha256': 'd58a54256b50f2dbfbd5014183a65b19975173e1439c4a1806e8b04f53342131'}]
          base = 'https://office-dishes-fitting-winter.trycloudflare.com/'
          for item in files:
              path = pathlib.Path(item['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(base + item['name'], timeout=180) as response:
                  data = response.read(item['bytes'] + 1)
              assert len(data) == item['bytes']
              assert hashlib.sha256(data).hexdigest() == item['sha256']
              path.write_bytes(data)
          index = pathlib.Path('report/index.html')
          text = index.read_text()
          block = '<h4>github 재생</h4>\n<ul>\n<li><a href="mov/261005_uav_codex-blender_sj/">github 영상 재생 페이지</a><br><small>github · 1920×1080 · 4:26 · 86.53 MB · 30fps<br>H.265/HEVC Main10 + AAC · 2.40 Mbps · Rec.709 · 10bit · .mp4</small></li>\n<li><a href="mov/261005_uav_codex-blender_sj/261005_codex_blender_sj_v01_100MB_h265.mp4">github 재생 MP4</a><br><small>github · 1920×1080 · 4:26 · 86.53 MB · 30fps<br>H.265/HEVC Main10 + AAC · 2.40 Mbps · Rec.709 · 10bit · .mp4</small></li>\n</ul>\n'
          if 'mov/261005_uav_codex-blender_sj/261005_codex_blender_sj_v01_100MB_h265.mp4' not in text:
              marker = '<h4>Cloudflare R2 재생</h4>'
              assert text.count(marker) == 1
              index.write_text(text.replace(marker, block + marker, 1))
      - name: Publish files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/index.html report/mov/261005_uav_codex-blender_sj/index.html report/mov/261005_uav_codex-blender_sj/261005_codex_blender_sj_v01_100MB_h265.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish GPU Main10 Blender 02 video and responsive GitHub player"
          git pull --rebase origin main
          git push origin HEAD:main
