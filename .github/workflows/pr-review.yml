name: PR Auto Review

# 모든 PR에 자동 리뷰 (Anthropic 공식 examples/pr-review-comprehensive.yml 기반)
# 인증: MAX plan OAuth token (CLAUDE_CODE_OAUTH_TOKEN secret 필수)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            본 ane1235.github.io는 정적 웹앱 (HTML·CSS·JavaScript) 중심의 GitHub Pages 사이트입니다 (calc·ksctva·devdocs 등 다중 미니 앱). 다음 영역을 중점 검토:

            1. **HTML 구조·접근성 (Accessibility)**
               - 시맨틱 태그 (header·main·nav·section·article·footer) 사용 여부
               - 이미지 alt 텍스트, ARIA 라벨, 키보드 탐색 가능 여부
               - lang 속성, viewport meta, 적절한 heading 위계

            2. **CSS 품질**
               - 모바일 반응형 (media query·flex·grid)
               - 색상 대비 (WCAG AA 기준 권장)
               - 일관된 스페이싱·타이포그래피

            3. **JavaScript 품질**
               - DOM 조작의 안전성 (XSS 방어 — innerHTML보다 textContent 우선)
               - 이벤트 리스너 누수, 메모리 leak
               - `let`/`const` vs `var`, 익명 함수의 가독성
               - 전역 namespace 오염 방지

            4. **GitHub Pages 호환성**
               - 절대 경로 vs 상대 경로 (sub-path 배포 시 깨짐 위험)
               - `index.html` 자동 라우팅 의존
               - ES6 모듈은 모던 브라우저 한정 — fallback 검토

            5. **보안·성능**
               - 외부 스크립트(CDN) 무결성 (`integrity`·`crossorigin` 속성)
               - 큰 이미지 lazy loading
               - 인라인 스크립트의 CSP 영향

            6. **콘텐츠 무결성 (markdown 한정)**
               - 한국어 문법, 위키 링크 깨짐 여부
               - frontmatter 정합성 (title·date 등)

            inline 코멘트로 구체 이슈, 일반 관찰은 top-level 코멘트.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
