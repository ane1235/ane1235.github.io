name: Publish sunset film 261004
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-sunset-261004.yml]
permissions:
  contents: write
concurrency:
  group: publish-sunset-261004
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message != 'Remove completed sunset transfer workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Download and verify final video assets
        shell: python
        run: |
          import hashlib, pathlib, urllib.request
          files = [{'name': 'sunset_261004_h265.mp4', 'bytes': 91601894, 'sha256': 'ec14a98c0b71b6ff8b8c0ed6d571803f506ec591acf24329ff00afe35bee9016'}, {'name': 'sunset_261004.webm', 'bytes': 89767093, 'sha256': '0f09e507948fe13d0a9123c55663d34e3f7686f8e59fc3c719cb10119b525eee'}, {'name': 'poster.jpg', 'bytes': 124229, 'sha256': 'b3acc4ce75c72b9d81d420072cca3d219844472840d6f9174a711f1f7611cd81'}, {'name': 'index.html', 'bytes': 2330, 'sha256': 'd85cb1ea68784192826d2e3495254ddb0f6bd2033f21ecd28f68ded6e65565d7'}]
          base = 'https://shoes-wishes-benefits-bunch.trycloudflare.com/'
          dest = pathlib.Path('report/mov/261004_blender')
          dest.mkdir(parents=True, exist_ok=True)
          for item in files:
              path = dest / item['name']
              assert path.name == item['name']
              temp = path.with_suffix(path.suffix + '.download')
              digest = hashlib.sha256()
              total = 0
              req = urllib.request.Request(base + item['name'], headers={'User-Agent': 'sunset-delivery/1.0'})
              with urllib.request.urlopen(req, timeout=120) as response, temp.open('wb') as output:
                  while chunk := response.read(1024 * 1024):
                      total += len(chunk)
                      if total > item['bytes']:
                          raise RuntimeError('Unexpected file size: ' + item['name'])
                      output.write(chunk)
                      digest.update(chunk)
              assert total == item['bytes'], (item['name'], total)
              assert digest.hexdigest() == item['sha256'], item['name']
              temp.replace(path)
              print(item['name'], total, digest.hexdigest())
      - name: Commit the verified film and player
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- report/mov/261004_blender/index.html report/mov/261004_blender/poster.jpg report/mov/261004_blender/sunset_261004_h265.mp4 report/mov/261004_blender/sunset_261004.webm
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish 어느날 해질녘 film and player"
          git pull --rebase origin main
          git push origin HEAD:main
