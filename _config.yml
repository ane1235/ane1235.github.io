theme: jekyll-theme-modernist
title: ane1235 Repository
description: 문서 및 분석 저장소

# GitHub Pages 호환 설정
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - vendor
  - .claude

# Jekyll Collections - 4link/report 문서 처리
collections:
  4link_reports:
    output: true
    permalink: /4link/report/:title/

# Default layouts
defaults:
  - scope:
      path: "4link/report"
      type: pages
    values:
      layout: report
  - scope:
      path: "4link/report"
      type: 4link_reports
    values:
      layout: report

# Plugins
plugins:
  - jekyll-seo-tag

# URL
url: "https://ane1235.github.io"
baseurl: ""
