<script>
const shell=document.querySelector('.player-shell');
const media=shell.querySelector('iframe,video');
const fullscreenButton=document.querySelector('[data-fullscreen]');
const tools=document.querySelector('.player-tools');
let hideTimer,draggingControls=false,keyboardControls=false;
function scheduleHide(){
 clearTimeout(hideTimer);
 if(!expanded())return;
 hideTimer=setTimeout(()=>{
  if(!expanded()||draggingControls||(keyboardControls&&tools.contains(document.activeElement)))return;
  if(tools.contains(document.activeElement))document.activeElement.blur();
  shell.classList.add('controls-hidden');
 },3000);
}
function showControls(){shell.classList.remove('controls-hidden');scheduleHide();}
shell.addEventListener('pointermove',showControls);
shell.addEventListener('pointerdown',e=>{
 keyboardControls=false;
 if(e.target.closest('.player-tools'))draggingControls=true;
 showControls();
});
document.addEventListener('pointerup',()=>{if(draggingControls){draggingControls=false;showControls();}});
document.addEventListener('pointercancel',()=>{draggingControls=false;showControls();});
shell.addEventListener('keydown',()=>{keyboardControls=true;showControls();});
tools.addEventListener('focusin',showControls);
tools.addEventListener('focusout',scheduleHide);
media.addEventListener('play',showControls);
media.addEventListener('pause',showControls);
media.addEventListener('ended',showControls);
function expanded(){return !!document.fullscreenElement||shell.classList.contains('screen-expanded')}
function sync(){fullscreenButton.textContent=expanded()?'화면 축소':'전체화면';fullscreenButton.setAttribute('aria-pressed',String(expanded()));showControls();}
fullscreenButton.addEventListener('click',async()=>{
 if(expanded()){
  if(document.fullscreenElement){await document.exitFullscreen();}
  shell.classList.remove('screen-expanded');document.body.classList.remove('player-expanded');sync();return;
 }
 if(media.tagName==='VIDEO'&&!shell.requestFullscreen&&media.webkitEnterFullscreen){media.webkitEnterFullscreen();return;}
 try{if(!shell.requestFullscreen)throw Error('unsupported');await shell.requestFullscreen();}
 catch{shell.classList.add('screen-expanded');document.body.classList.add('player-expanded');}
 sync();
});
document.addEventListener('fullscreenchange',sync);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){shell.classList.remove('screen-expanded');document.body.classList.remove('player-expanded');sync();}});
const external=document.querySelector('[data-drive-open]');
if(external){document.querySelectorAll('a[target="drive-video"]').forEach(a=>a.addEventListener('click',()=>{external.href=a.href.replace('/preview','/view');}));}
const seek=document.querySelector('[data-seek]'),time=document.querySelector('[data-time]'),mute=document.querySelector('[data-mute]'),message=document.querySelector('.player-message');
const clock=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function updateTime(){const duration=Number.isFinite(media.duration)?media.duration:266;seek.max=duration;seek.value=media.currentTime;time.textContent=clock(media.currentTime)+' / '+clock(duration);}
media.addEventListener('timeupdate',updateTime);media.addEventListener('loadedmetadata',updateTime);
seek.addEventListener('input',()=>{if(media.readyState>=1)media.currentTime=Number(seek.value);});
document.querySelector('[data-back]').addEventListener('click',()=>{if(media.readyState>=1)media.currentTime=Math.max(0,media.currentTime-10);});
document.querySelector('[data-forward]').addEventListener('click',()=>{if(media.readyState>=1)media.currentTime=Math.min(Number.isFinite(media.duration)?media.duration:266,media.currentTime+10);});
mute.addEventListener('click',()=>{media.muted=!media.muted;mute.textContent=media.muted?'소리 켜기':'음소거';mute.setAttribute('aria-pressed',String(media.muted));});
media.addEventListener('error',()=>{message.hidden=false;media.controls=true;});
media.addEventListener('playing',()=>{setTimeout(()=>{if(media.videoWidth===0)message.hidden=false;},1500);});
media.controls=false;
const playButton=document.querySelector('[data-play]');
if(playButton){playButton.addEventListener('click',async()=>{if(media.paused){try{await media.play();}catch{playButton.textContent='다시 재생';message.hidden=false;}}else media.pause();});const update=()=>{playButton.textContent=media.paused?'재생':'일시정지';};media.addEventListener('play',update);media.addEventListener('pause',update);}

async function startAutomatically(){
 try{await media.play();}
 catch(error){
  if(error.name!=='NotAllowedError')return;
  media.muted=true;
  try{await media.play();}catch{showControls();}
 }
}
media.addEventListener('volumechange',()=>{mute.textContent=media.muted?'소리 켜기':'음소거';mute.setAttribute('aria-pressed',String(media.muted));});
startAutomatically();
</script>
