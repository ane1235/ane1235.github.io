
<meta name="robots" content="noindex, nofollow">
<article class="brand" data-brand="$brand_id" data-item="$id" data-model-name="$model">
  <div class="brand-head">
    <div>$heading<p class="model">기준 모델 · $model_text</p></div>
    $heading_info
  </div>
  <div class="table-wrap">
    <table aria-label="$table_label">
      <thead><tr><th scope="col">사이즈</th>$columns</tr></thead>
      <tbody>$rows</tbody>
    </table>
  </div>
  <div class="cards">$cards</div>
  <p class="empty" hidden>등록된 치수가 없습니다.</p>
  $measurement_note
  $below
</article>
