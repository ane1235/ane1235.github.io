<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">

  <meta charset="utf-8">

  <title>의류 사이즈 노트</title>
  <link rel="stylesheet" href="style.css">

<body class="desktop viewer-page">
<main>
  <a class="back" href="../">← 목록</a>
  <header id="collection-heading"><h1>의류 사이즈 노트</h1><p class="intro">메이커·모델별 사이즈 원표기와 세부 치수</p></header>
  <nav class="nav" aria-label="보기 방식"><a href="index.html" aria-current="page">치수 조회</a><a href="compare.html">사이즈 비교</a><a href="static.html">정적 전체표</a></nav>
  <fieldset class="filters viewer-filters" disabled>

</main>
