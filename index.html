<!DOCTYPE html>
<!--
  KSCTVA 2026 춘계학술대회 — GitHub Pages 버전
  V2.1 (2026-03-10) 완전 재작성
  ─────────────────────────────────────────────
  호스팅: GitHub Pages (ane1235.github.io)
  통신: fetch API → Apps Script JSON API
  ─────────────────────────────────────────────
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSCTVA 2026 춘계학술대회</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#2563eb', dark: '#1a365d', light: '#dbeafe', lighter: '#f0f7ff' },
            accent: '#f59e0b',
            danger: '#ef4444'
          }
        }
      }
    };
  </script>

  <style>
  /* ── 기본 ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f7ff; color: #1e293b; }
  .material-icons { vertical-align: middle; font-size: 20px; }

  /* ── 로그인 ── */
  .login-bg {
    background: linear-gradient(135deg, #1a365d 0%, #2563eb 50%, #1a365d 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .login-bg::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(255,255,255,0.03) 50px, rgba(255,255,255,0.03) 51px);
  }
  .ecg-line { position: absolute; width: 200%; height: 2px; background: rgba(96,165,250,0.15); top: 50%; }
  .ecg-line::after {
    content: ''; position: absolute; width: 100%; height: 100%;
    background: linear-gradient(90deg,
      transparent 0%, transparent 40%,
      rgba(96,165,250,0.4) 42%, rgba(96,165,250,0.8) 44%,
      transparent 44.5%, transparent 45.5%,
      rgba(96,165,250,1) 46%, transparent 47%,
      rgba(96,165,250,0.6) 48%, transparent 49%,
      transparent 100%);
    animation: ecgMove 4s linear infinite;
  }
  @keyframes ecgMove { from { transform: translateX(-50%); } to { transform: translateX(0); } }

  .login-card {
    background: rgba(255,255,255,0.95); border-radius: 16px; padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 380px; width: 90%;
    position: relative; z-index: 10; backdrop-filter: blur(10px);
  }
  .login-card input {
    width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px;
    font-size: 15px; transition: border-color 0.2s; outline: none;
  }
  .login-card input:focus { border-color: #2563eb; }
  .logo-img { width: 64px; height: 64px; margin-bottom: 16px; }

  /* ── 네비게이션 ── */
  .navbar {
    background: #1a365d; color: white; padding: 0 16px;
    display: flex; align-items: center; height: 56px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .nav-item {
    padding: 0 14px; height: 56px; display: flex; align-items: center;
    cursor: pointer; position: relative; font-size: 14px; font-weight: 500;
    transition: background 0.2s; white-space: nowrap;
  }
  .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); }

  .dropdown-menu {
    display: none; position: absolute; top: 56px; left: 0;
    background: white; color: #1e293b; border-radius: 0 0 8px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15); min-width: 200px; z-index: 200;
    overflow: hidden;
  }
  .dropdown-menu.show { display: block; }
  .dropdown-item {
    padding: 12px 16px; cursor: pointer; font-size: 14px;
    transition: background 0.15s; border-bottom: 1px solid #f1f5f9;
  }
  .dropdown-item:hover { background: #dbeafe; }
  .dropdown-item:last-child { border-bottom: none; }

  /* ── 콘텐츠 ── */
  .content-area { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }

  /* ── Overview 테이블 ── */
  .overview-table { width: 100%; table-layout: fixed; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .overview-table th { background: #1a365d; color: white; padding: 12px 16px; text-align: center; font-size: 14px; }
  .overview-table td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; font-size: 14px; line-height: 1.5; }
  .overview-table tr.clickable { cursor: pointer; transition: background 0.15s; }
  .overview-table tr.clickable:hover { background: #dbeafe; }
  .overview-table tr.break-row { background: #f8fafc; color: #94a3b8; }
  .overview-table tr.break-row td { text-align: center; }
  .overview-table tr.event-center td { text-align: center; }
  .overview-table td.session-common { text-align: center; }
  .overview-table tr.day-header td { background: #2563eb; color: white; font-weight: 700; font-size: 15px; padding: 14px 16px; }
  .session-num { font-weight: 700; color: #1d4ed8; }

  /* ── 세션 ── */
  .session-section { background: white; border-radius: 12px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .session-header { background: #1a365d; color: white; padding: 14px 20px; font-size: 15px; font-weight: 600; }
  .session-chair { background: #f0f7ff; padding: 10px 20px; font-size: 13px; color: #475569; border-bottom: 1px solid #e2e8f0; }

  /* ── 강좌 행 ── */
  .lecture-row {
    display: flex; align-items: stretch; padding: 12px 20px; border-bottom: 1px solid #f1f5f9;
    cursor: pointer; transition: all 0.15s; position: relative;
  }
  .lecture-row:hover { background: #f0f7ff; }
  .lecture-row.selected { background: #dbeafe; border-left: 4px solid #2563eb; }
  .lecture-row.selected .select-indicator { color: #2563eb; }
  .lecture-row .lec-time { width: 120px; flex-shrink: 0; font-size: 13px; color: #64748b; font-weight: 500; padding-top: 2px; }
  .lecture-row .lec-title { flex: 1; font-size: 14px; font-weight: 500; padding: 0 12px; }
  .lecture-row .lec-speaker { width: 200px; flex-shrink: 0; font-size: 13px; color: #64748b; text-align: right; }
  .select-indicator { font-size: 18px; color: #cbd5e1; margin-right: 10px; flex-shrink: 0; transition: color 0.15s; }

  /* ── 이벤트 행 ── */
  .event-row {
    display: flex; align-items: center; padding: 10px 20px; border-bottom: 1px solid #f1f5f9;
    background: #f8fafc; color: #94a3b8; font-size: 13px;
  }
  .event-row .lec-time { width: 120px; flex-shrink: 0; font-weight: 500; }
  .event-row .lec-title { flex: 1; padding: 0 12px; }
  .event-row .lec-speaker { width: 200px; flex-shrink: 0; text-align: right; }

  /* ── 시간 하이라이트 ── */
  .time-highlight { background: #fef3c7 !important; border-left: 4px solid #f59e0b !important; }
  .time-highlight.selected { background: #fde68a !important; }

  /* ── MyPage ── */
  .mypage-tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; }
  .mypage-tab {
    padding: 10px 24px; cursor: pointer; font-weight: 500; font-size: 14px;
    border-bottom: 3px solid transparent; transition: all 0.2s; color: #94a3b8;
  }
  .mypage-tab.active { color: #2563eb; border-bottom-color: #2563eb; }

  .my-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .my-table th { background: #1a365d; color: white; padding: 10px 14px; font-size: 13px; text-align: left; }
  .my-table td { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; font-size: 13px; vertical-align: top; }
  .my-table tr.slot-row { background: #f8fafc; }
  .my-table tr.slot-row td:first-child { font-weight: 600; color: #1a365d; }

  .room-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap;
  }
  .room-badge.room-1 { background: #dbeafe; color: #1e40af; }
  .room-badge.room-2 { background: #fce7f3; color: #9d174d; }
  .room-badge.room-common { background: #e2e8f0; color: #475569; }

  /* ── 중복 경고 ── */
  .overlap-row { background: #fef2f2 !important; }
  .overlap-group-start td {
    height: 3px; padding: 0 !important;
    background: linear-gradient(90deg, #dc2626 0%, #dc2626 4px, transparent 4px);
    border-bottom: 2px solid #fecaca !important;
  }
  .overlap-group-end td {
    background: #fff5f5; padding: 6px 14px !important;
    border-top: none !important; border-bottom: 2px solid #fecaca !important;
  }
  .overlap-row td:first-child, .overlap-row td:nth-child(1) {
    border-left: 4px solid #dc2626;
  }
  .overlap-legend {
    display: flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 8px 14px;
    background: #fff5f5; border: 1px solid #fecaca; border-radius: 8px;
    font-size: 12px; color: #7f1d1d;
  }
  .overlap-legend-swatch {
    display: inline-block; width: 14px; height: 14px;
    background: #fef2f2; border: 2px solid #dc2626; border-radius: 3px;
  }

  /* ── 기타 UI ── */
  .spinner { border: 3px solid #dbeafe; border-top: 3px solid #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a365d; color: white; padding: 12px 24px; border-radius: 8px;
    font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; }

  .view-container { animation: fadeIn 0.25s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .hidden { display: none !important; }

  /* ── 모바일 반응형 ── */
  @media (max-width: 768px) {
    .navbar { padding: 0 8px; }
    .nav-item { padding: 0 10px; font-size: 13px; }
    .content-area { padding: 12px 8px; }

    .lecture-row { flex-wrap: wrap; padding: 10px 14px; }
    .lecture-row .lec-time { width: auto; order: 1; }
    .lecture-row .lec-speaker { width: auto; order: 2; text-align: left; margin-left: 8px; }
    .lecture-row .lec-title { width: 100%; order: 3; padding: 4px 0 0 28px; font-size: 14px; }
    .select-indicator { order: 0; }

    .event-row { flex-wrap: wrap; padding: 8px 14px; }
    .event-row .lec-time { width: auto; }
    .event-row .lec-speaker { width: auto; text-align: left; margin-left: 8px; }
    .event-row .lec-title { width: 100%; padding: 4px 0 0 0; }

    .overview-table td { padding: 10px 8px; font-size: 13px; }
    .overview-table th { padding: 10px 8px; font-size: 13px; }
  }
  </style>
</head>

<body>

  <!-- ===== 로그인 화면 ===== -->
  <div id="view-login" class="login-bg">
    <div class="ecg-line" style="top:30%"></div>
    <div class="ecg-line" style="top:50%; animation-delay: -1.5s;"></div>
    <div class="ecg-line" style="top:70%; animation-delay: -3s;"></div>

    <div class="login-card text-center">
      <img src="https://ane1235.github.io/assets/purmi_heart.png"
           alt="Logo" class="logo-img mx-auto"
           onerror="this.style.display='none'">

      <h1 class="text-xl font-bold text-primary-dark mb-1">KSCTVA 2026</h1>
      <p class="text-sm text-gray-500 mb-6">춘계 학술대회 프로그램</p>

      <div class="mb-4">

               class="mb-3" onkeydown="if(event.key==='Enter') document.getElementById('input-sn2').focus()">

      </button>

    </div>
  </div>

  <!-- ===== 앱 컨테이너 ===== -->
  <div id="app-container" class="hidden">

    <nav class="navbar">
      <div class="nav-item" onclick="showView('overview')" style="font-weight:700; font-size:15px;">
        <span class="material-icons mr-1" style="font-size:22px;">home</span>
        <span class="hidden sm:inline">Home</span>
      </div>

      <div class="nav-item" onclick="toggleDropdown('day1')" id="nav-day1">
        Day 1 <span class="material-icons" style="font-size:18px; margin-left:2px;">arrow_drop_down</span>
        <div class="dropdown-menu" id="dropdown-day1"></div>
      </div>

      <div class="nav-item" onclick="toggleDropdown('day2')" id="nav-day2">
        Day 2 <span class="material-icons" style="font-size:18px; margin-left:2px;">arrow_drop_down</span>
        <div class="dropdown-menu" id="dropdown-day2"></div>
      </div>

      <div class="nav-item" onclick="showView('mypage')" id="nav-mypage">
        <span class="material-icons mr-1" style="font-size:20px;">person</span>
        My
      </div>

      <div class="ml-auto flex items-center text-sm opacity-80">
        <span id="user-display" class="hidden sm:inline"></span>
        <span class="material-icons ml-2 cursor-pointer" style="font-size:20px;" onclick="handleLogout()" title="로그아웃">logout</span>
      </div>
    </nav>

    <div class="content-area" id="content-area">
      <div id="loading-screen" class="text-center py-20">
        <div class="spinner mb-4"></div>
        <p class="text-gray-500">학술대회 프로그램을 불러오는 중...</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ===== JavaScript: API + 유틸리티 ===== -->
  <script>
  // Apps Script 웹앱 URL
  var API_URL = 'https://script.google.com/macros/s/AKfycbySQil2bfJ-Iicws05I7fFvbZbmmcSR1-BKjMlhg8i0pozBhJWo06b5h0p_DcIdaq3v/exec';

  // GET 요청 헬퍼
  function callApi(params) {
    var qs = Object.keys(params).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return fetch(API_URL + '?' + qs, { redirect: 'follow' })
      .then(function(res) { return res.json(); });
  }

  // POST 요청 헬퍼 (Content-Type: text/plain → CORS preflight 회피)
  function callApiPost(body) {
    return fetch(API_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body)
    }).then(function(res) { return res.json(); });
  }

  // HTML 이스케이프
  function escHtml(str) {
    if (!str) return '';
    return str.toString()
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 토스트 메시지
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  // 시간 파싱: "10:30" → { h:10, m:30, total:630 }
  function parseTime(str) {
    if (!str) return null;
    var m = str.trim().match(/(\d{1,2}):(\d{2})/);
    if (!m) return null;
    var h = parseInt(m[1]), mi = parseInt(m[2]);
    return { h: h, m: mi, total: h * 60 + mi };
  }

  // 현재 시간 하이라이트 (1분마다 갱신)
  function updateTimeHighlight() {
    document.querySelectorAll('.time-highlight').forEach(function(el) {
      el.classList.remove('time-highlight');
    });
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    document.querySelectorAll('[data-time]').forEach(function(el) {
      var ts = el.getAttribute('data-time');
      var parts = ts.split(/[\u2013\-]/);
      if (parts.length < 2) return;
      var s = parseTime(parts[0]), e = parseTime(parts[1]);
      if (s && e && nowMin >= s.total && nowMin < e.total) {
        el.classList.add('time-highlight');
      }
    });
  }

  // 세션 제목에서 Room 정보 추출
  function getRoomFromSectionTitle(title) {
    if (!title) return '\u2014';
    if (/Room\s*1\s*[&]\s*2/.test(title) || title.indexOf('\uACF5\uD1B5') >= 0) return '\uACF5\uD1B5';
    if (/Room\s*1/i.test(title)) return 'Room 1';
    if (/Room\s*2/i.test(title)) return 'Room 2';
    return '\u2014';
  }

  // 세션 데이터 파싱 (raw 2D배열 → 섹션 배열)
  function parseSessionData(tabName, rawData) {
    var sections = [];
    var cur = null;
    for (var i = 0; i < rawData.length; i++) {
      var r = rawData[i];
      var c0 = (r[0] || '').toString().trim();
      var c1 = (r[1] || '').toString().trim();
      var c2 = (r[2] || '').toString().trim();
      if (!c0 && !c1 && !c2) continue;
      if (c0.indexOf('\uD83D\uDCC5') === 0) continue;
      if (c0.indexOf('Session') === 0) {
        cur = { title: c0, chair: null, room: getRoomFromSectionTitle(c0), items: [] };
        sections.push(cur);
        continue;
      }
      if (c0 === '\uC2DC\uAC04' && c1 === '\uC81C\uBAA9') continue;
      if (c0.indexOf('\uC88C\uC7A5') === 0) { if (cur) cur.chair = c0; continue; }
      if (!cur) continue;
      if (c0 && /\d{1,2}:\d{2}/.test(c0)) {
        var isEv = isEventRow(c1);
        cur.items.push({
          id: tabName + '_R' + i,
          time: c0, title: c1, speaker: c2,
          selectable: !isEv && !!c1 && !!c2,
          rowIndex: i, room: cur.room
        });
      }
    }
    return sections;
  }

  // 이벤트(토론, 런천, 휴식 등) 판별
  function isEventRow(title) {
    if (!title) return true;
    var kw = ['\uD1A0\uB860', 'Discussion', '\uB7F0\uCC9C', '\uD734\uC2DD', '\uD3D0\uD68C', '\uCD1D\uD68C', '\uAC1C\uD68C'];
    for (var k = 0; k < kw.length; k++) {
      if (title.indexOf(kw[k]) >= 0) return true;
    }
    return false;
  }

  // 강좌 ID로 강좌 데이터 조회
  function getLectureDataById(id) {
    var p = id.lastIndexOf('_R');
    if (p < 0) return null;
    var tab = id.substring(0, p);
    var ri = parseInt(id.substring(p + 2));
    if (!state.appData.sessions[tab]) return null;
    var raw = state.appData.sessions[tab];
    var row = raw[ri];
    if (!row) return null;
    var room = '\u2014';
    for (var j = ri; j >= 0; j--) {
      var chk = (raw[j][0] || '').toString().trim();
      if (chk.indexOf('Session') === 0) { room = getRoomFromSectionTitle(chk); break; }
    }
    return {
      id: id, tab: tab,
      time: (row[0] || '').toString().trim(),
      title: (row[1] || '').toString().trim(),
      speaker: (row[2] || '').toString().trim(),
      room: room
    };
  }

  // 세션 셀 포맷: "Session ##" 강조 + 줄바꿈→<br>
  function formatSessionCell(text) {
    if (!text) return '';
    var h = escHtml(text);
    h = h.replace(/(Session\s+\d+)/, '<span class="session-num">$1</span>');
    return h.replace(/\n/g, '<br>');
  }

  // 헤더에서 Room 이름만 추출: "Day 1 (4/11 토) — Room 1" → "Room 1"
  function extractRoomName(headerText) {
    if (!headerText) return '';
    var parts = headerText.split('\u2014');
    if (parts.length >= 2) return parts[parts.length - 1].trim();
    parts = headerText.split(' - ');
    if (parts.length >= 2) return parts[parts.length - 1].trim();
    return headerText;
  }

  // break 행 판별 (휴식, 폐회)
  function isBreakRow(text) {
    if (!text) return true;
    var kw = ['\uD734\uC2DD', '\uD3D0\uD68C'];
    for (var i = 0; i < kw.length; i++) { if (text.indexOf(kw[i]) >= 0) return true; }
    return false;
  }

  // 이벤트 가운데 정렬 대상 판별 (총회, 개회식, 런천, 휴식, 폐회)
  function isEventCenter(text) {
    if (!text) return false;
    var kw = ['\uCD1D\uD68C', '\uAC1C\uD68C', '\uB7F0\uCC9C', '\uD734\uC2DD', '\uD3D0\uD68C'];
    for (var k = 0; k < kw.length; k++) { if (text.indexOf(kw[k]) >= 0) return true; }
    return false;
  }

  // overview 행에서 줄바꿈 처리 + HTML 이스케이프
  function formatOverviewCell(text) {
    if (!text) return '';
    return escHtml(text).replace(/\n/g, '<br>');
  }

  // overview 세션 행 → 탭 이름 매핑
  function findTabForOverviewRow(timeStr, sessionText, rowIdx) {
    var m = sessionText.match(/Session\s+(\d+)/);
    if (m) {
      var sn = parseInt(m[1]);
      var map = { 1:'Day1_A1', 2:'Day1_A1', 3:'Day1_P1', 4:'Day1_P2', 5:'Day1_P2',
                  6:'Day1_P3', 7:'Day1_P3', 8:null, 9:'Day2_A1', 10:'Day2_A1',
                  11:'Day2_P1', 12:'Day2_P1', 13:'Day2_P2', 14:'Day2_P2' };
      return map[sn] || null;
    }
    if (sessionText.indexOf('\uB7F0\uCC9C \uC138\uC158 1') >= 0 || sessionText.indexOf('\uB7F0\uCC9C \uC138\uC158 2') >= 0) return 'Day1_A1';
    if (sessionText.indexOf('\uB7F0\uCC9C \uC138\uC158 3') >= 0 || sessionText.indexOf('\uB7F0\uCC9C \uC138\uC158 4') >= 0) return 'Day2_A1';
    return null;
  }

  // MyPage: 강좌 시간 → overview 슬롯 매칭
  function findMatchingSlot(lectureTime, slots) {
    var ls = parseTime(lectureTime.split(/[\u2013\-]/)[0]);
    if (!ls) return null;
    for (var i = 0; i < slots.length; i++) {
      var r = slots[i].time.split(/[\u2013\-]/);
      var ss = parseTime(r[0]), se = parseTime(r[1]);
      if (ss && se && ls.total >= ss.total && ls.total < se.total) return slots[i].time;
    }
    return null;
  }
  </script>

  <!-- ===== JavaScript: 상태관리 + 로그인 ===== -->
  <script>
  // 전역 상태
  var state = {
    user: null,
    appData: null,
    selections: [],
    currentView: 'login',
    currentTab: null,
    mypageDay: 1,
    highlightTimer: null
  };

  // 로그인 버튼 클릭
  function handleLoginSubmit() {
    var name = document.getElementById('input-name').value.trim();
    var sn2 = document.getElementById('input-sn2').value.trim();
    var errEl = document.getElementById('login-error');

    if (!name || !sn2) {
      errEl.textContent = '\uC774\uB984\uACFC \uC0AC\uBC88\uC744 \uBAA8\uB450 \uC785\uB825\uD574\uC8FC\uC138\uC694.';
      errEl.classList.remove('hidden');
      return;
    }
    errEl.classList.add('hidden');

    callApi({ action: 'login', name: name, sn2: sn2 })
      .then(onLoginSuccess)
      .catch(function(err) {
        errEl.textContent = '\uC11C\uBC84 \uC5F0\uACB0 \uC624\uB958: ' + err.message;
        errEl.classList.remove('hidden');
      });
  }

  function onLoginSuccess(result) {
    var errEl = document.getElementById('login-error');
    if (result.success) {
      state.user = result.data;
      initApp();
    } else {
      errEl.textContent = result.error || '\uB85C\uADF8\uC778\uC5D0 \uC2E4\uD328\uD588\uC2B5\uB2C8\uB2E4.';
      errEl.classList.remove('hidden');
    }
  }

  function initApp() {
    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('app-container').classList.remove('hidden');
    document.getElementById('user-display').textContent = state.user.name;
    loadAppData();
  }

  function loadAppData() {
    var loaded = { data: false, sel: false };

    callApi({ action: 'getAllData' })
      .then(function(result) {
        if (result.success) { state.appData = result.data; buildDropdownMenus(); }
        loaded.data = true;
        if (loaded.data && loaded.sel) onAllDataReady();
      })
      .catch(function(err) {
        showToast('\uB370\uC774\uD130 \uB85C\uB4DC \uC2E4\uD328: ' + err.message);
        loaded.data = true;
        if (loaded.data && loaded.sel) onAllDataReady();
      });

    callApi({ action: 'getSelections', sn2: state.user.sn2 })
      .then(function(result) {
        if (result.success) { state.selections = result.data || []; }
        loaded.sel = true;
        if (loaded.data && loaded.sel) onAllDataReady();
      })
      .catch(function(err) {
        state.selections = [];
        loaded.sel = true;
        if (loaded.data && loaded.sel) onAllDataReady();
      });
  }

  function onAllDataReady() {
    showView('overview');
    updateTimeHighlight();
    state.highlightTimer = setInterval(updateTimeHighlight, 60000);
  }

  function handleLogout() {
    if (state.highlightTimer) clearInterval(state.highlightTimer);
    state.user = null;
    state.appData = null;
    state.selections = [];
    state.currentView = 'login';
    document.getElementById('app-container').classList.add('hidden');
    document.getElementById('view-login').classList.remove('hidden');
    document.getElementById('input-name').value = '';
    document.getElementById('input-sn2').value = '';
    document.getElementById('login-error').classList.add('hidden');
  }

  // 강좌 선택/해제 토글
  function toggleLecture(lectureId) {
    var idx = state.selections.indexOf(lectureId);
    if (idx >= 0) { state.selections.splice(idx, 1); }
    else { state.selections.push(lectureId); }

    var el = document.querySelector('[data-id="' + lectureId + '"]');
    if (el) {
      var sel = state.selections.indexOf(lectureId) >= 0;
      el.classList.toggle('selected', sel);
      var icon = el.querySelector('.select-indicator');
      if (icon) icon.textContent = sel ? 'check_circle' : 'radio_button_unchecked';
    }

    callApiPost({ action: 'saveSelections', sn2: state.user.sn2, selections: state.selections })
      .then(function(r) { if (!r.success) showToast('\uC800\uC7A5 \uC2E4\uD328: ' + (r.error || '')); })
      .catch(function(err) { showToast('\uC800\uC7A5 \uC624\uB958: ' + err.message); });

    showToast(idx >= 0 ? '\uC120\uD0DD \uD574\uC81C\uB428' : '\uC120\uD0DD \uC644\uB8CC');
  }
  </script>

  <!-- ===== JavaScript: 네비게이션 ===== -->
  <script>
  function buildDropdownMenus() {
    if (!state.appData || !state.appData.menuMap) return;
    var map = state.appData.menuMap;

    var dd1 = document.getElementById('dropdown-day1');
    dd1.innerHTML = '';
    if (map.DAY1) {
      map.DAY1.forEach(function(item) {
        var d = document.createElement('div');
        d.className = 'dropdown-item';
        d.textContent = item.label;
        d.onclick = function(e) { e.stopPropagation(); closeAllDropdowns(); showView('session', item.tab); };
        dd1.appendChild(d);
      });
    }

    var dd2 = document.getElementById('dropdown-day2');
    dd2.innerHTML = '';
    if (map.DAY2) {
      map.DAY2.forEach(function(item) {
        var d = document.createElement('div');
        d.className = 'dropdown-item';
        d.textContent = item.label;
        d.onclick = function(e) { e.stopPropagation(); closeAllDropdowns(); showView('session', item.tab); };
        dd2.appendChild(d);
      });
    }
  }

  function toggleDropdown(id) {
    var menu = document.getElementById('dropdown-' + id);
    var open = menu.classList.contains('show');
    closeAllDropdowns();
    if (!open) menu.classList.add('show');
  }

  function closeAllDropdowns() {
    document.querySelectorAll('.dropdown-menu').forEach(function(el) { el.classList.remove('show'); });
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.nav-item')) closeAllDropdowns();
  });

  // 뷰 라우터
  function showView(viewName, param) {
    state.currentView = viewName;
    var area = document.getElementById('content-area');
    document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });

    switch (viewName) {
      case 'overview':
        area.innerHTML = '<div class="view-container">' + renderOverview() + '</div>';
        break;
      case 'session':
        state.currentTab = param;
        area.innerHTML = '<div class="view-container">' + renderSession(param) + '</div>';
        if (param && param.startsWith('Day1')) document.getElementById('nav-day1').classList.add('active');
        if (param && param.startsWith('Day2')) document.getElementById('nav-day2').classList.add('active');
        break;
      case 'mypage':
        area.innerHTML = '<div class="view-container">' + renderMyPage() + '</div>';
        document.getElementById('nav-mypage').classList.add('active');
        break;
      default:
        area.innerHTML = '<div class="view-container">' + renderOverview() + '</div>';
    }
    updateTimeHighlight();
    window.scrollTo(0, 0);
  }
  </script>

  <!-- ===== JavaScript: 뷰 렌더링 ===== -->
  <script>

  // ────────── Overview ──────────
  function renderOverview() {
    if (!state.appData || !state.appData.overview) {
      return '<p class="text-center py-10 text-gray-500">\uB370\uC774\uD130\uB97C \uBD88\uB7EC\uC62C \uC218 \uC5C6\uC2B5\uB2C8\uB2E4.</p>';
    }
    var rows = state.appData.overview;
    var html = '';

    html += '<div class="text-center mb-6">';
    html += '<h2 class="text-2xl font-bold text-primary-dark">' + escHtml(rows[0][0] || '') + '</h2>';
    html += '<p class="text-sm text-gray-500 mt-1">' + escHtml(rows[1] ? rows[1][0] : '') + '</p>';
    html += '</div>';

    html += '<table class="overview-table">';
    html += '<colgroup><col style="width:15%"><col style="width:42.5%"><col style="width:42.5%"></colgroup>';

    for (var i = 2; i < rows.length; i++) {
      var row = rows[i];
      var c0 = (row[0] || '').toString();
      var c1 = (row[1] || '').toString();
      var c2 = (row[2] || '').toString();
      if (!c0 && !c1 && !c2) continue;

      // Day 헤더
      if (c0.indexOf('\uD83D\uDCC5') === 0) {
        html += '<tr class="day-header"><td colspan="3">' + escHtml(c0) + '</td></tr>';
        continue;
      }
      // 컬럼 헤더 (시간 / Room 1 / Room 2)
      if (c0 === '\uC2DC\uAC04') {
        html += '<tr><th>' + escHtml(c0) + '</th>';
        html += '<th>' + escHtml(extractRoomName(c1)) + '</th>';
        if (c2) html += '<th>' + escHtml(extractRoomName(c2)) + '</th>';
        html += '</tr>';
        continue;
      }
      // 하단 안내
      if (c0.indexOf('\uC77C\uC2DC:') === 0 || c0.indexOf('\uC0AC\uC804\uB4F1\uB85D\uBE44') === 0) {
        html += '<tr><td colspan="3" class="text-xs text-gray-500" style="background:#f8fafc;">' + escHtml(c0) + '</td></tr>';
        continue;
      }

      var brk = isBreakRow(c1);
      var evt = isEventCenter(c1);
      var click = !brk && c1.indexOf('Session') >= 0;
      var tab = click ? findTabForOverviewRow(c0, c1, i) : null;
      var has2 = !!c2;
      var ta = c0 ? ' data-time="' + escHtml(c0) + '"' : '';

      if (brk) {
        html += '<tr class="break-row"' + ta + '>';
        html += '<td>' + escHtml(c0) + '</td>';
        html += '<td' + (has2 ? '' : ' colspan="2"') + '>' + escHtml(c1) + '</td>';
        if (has2) html += '<td>' + escHtml(c2) + '</td>';
        html += '</tr>';
      } else if (click) {
        html += '<tr class="clickable" onclick="onOverviewRowClick(\'' + (tab || '') + '\')"' + ta + '>';
        html += '<td>' + escHtml(c0) + '</td>';
        if (!has2) {
          html += '<td colspan="2" class="session-common">' + formatSessionCell(c1) + '</td>';
        } else {
          html += '<td>' + formatSessionCell(c1) + '</td>';
          html += '<td>' + formatSessionCell(c2) + '</td>';
        }
        html += '</tr>';
      } else if (evt) {
        html += '<tr class="event-center"' + ta + '>';
        html += '<td>' + escHtml(c0) + '</td>';
        html += '<td' + (has2 ? '' : ' colspan="2"') + '>' + escHtml(c1) + '</td>';
        if (has2) html += '<td>' + escHtml(c2) + '</td>';
        html += '</tr>';
      } else {
        html += '<tr' + ta + '>';
        html += '<td>' + escHtml(c0) + '</td>';
        html += '<td' + (has2 ? '' : ' colspan="2"') + '>' + escHtml(c1) + '</td>';
        if (has2) html += '<td>' + escHtml(c2) + '</td>';
        html += '</tr>';
      }
    }
    html += '</table>';

    var ev = state.appData.event;
    html += '<div class="text-center text-xs text-gray-400 mt-4">';
    html += escHtml(ev.VENUE) + ' | ' + escHtml(ev.DATE_DAY1) + ' ~ ' + escHtml(ev.DATE_DAY2);
    html += '</div>';
    return html;
  }

  function onOverviewRowClick(tabName) {
    if (tabName) showView('session', tabName);
  }

  // ────────── Session ──────────
  function renderSession(tabName) {
    if (!state.appData || !state.appData.sessions || !state.appData.sessions[tabName]) {
      return '<p class="text-center py-10 text-gray-500">\uC138\uC158 \uB370\uC774\uD130\uB97C \uCC3E\uC744 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4.</p>';
    }
    var rawData = state.appData.sessions[tabName];
    var sections = parseSessionData(tabName, rawData);
    var html = '';

    if (rawData.length > 0 && rawData[0][0]) {
      html += '<div class="text-center mb-4">';
      html += '<h3 class="text-lg font-bold text-primary-dark">' + escHtml(rawData[0][0]) + '</h3>';
      html += '</div>';
    }

    for (var s = 0; s < sections.length; s++) {
      var sec = sections[s];
      html += '<div class="session-section">';
      html += '<div class="session-header">' + escHtml(sec.title) + '</div>';
      if (sec.chair) {
        html += '<div class="session-chair"><span class="material-icons mr-1" style="font-size:16px; color:#2563eb;">person</span>' + escHtml(sec.chair) + '</div>';
      }
      for (var l = 0; l < sec.items.length; l++) {
        var item = sec.items[l];
        if (item.selectable) {
          var isSel = state.selections.indexOf(item.id) >= 0;
          html += '<div class="lecture-row' + (isSel ? ' selected' : '') + '" data-id="' + item.id + '" data-time="' + escHtml(item.time) + '" onclick="toggleLecture(\'' + item.id + '\')">';
          html += '<span class="material-icons select-indicator">' + (isSel ? 'check_circle' : 'radio_button_unchecked') + '</span>';
          html += '<div class="lec-time">' + escHtml(item.time) + '</div>';
          html += '<div class="lec-title">' + escHtml(item.title) + '</div>';
          html += '<div class="lec-speaker">' + escHtml(item.speaker) + '</div>';
          html += '</div>';
        } else {
          html += '<div class="event-row" data-time="' + escHtml(item.time) + '">';
          html += '<div class="lec-time">' + escHtml(item.time) + '</div>';
          html += '<div class="lec-title">' + escHtml(item.title) + '</div>';
          html += '<div class="lec-speaker">' + escHtml(item.speaker || '') + '</div>';
          html += '</div>';
        }
      }
      html += '</div>';
    }
    return html;
  }

  // ────────── MyPage ──────────
  function renderMyPage() {
    var html = '';
    html += '<div class="text-center mb-4">';
    html += '<h3 class="text-lg font-bold text-primary-dark"><span class="material-icons mr-1" style="vertical-align:middle;">bookmark</span>\uB0B4 \uAC15\uC88C</h3>';
    html += '<p class="text-sm text-gray-500">' + escHtml(state.user.name) + '\uB2D8\uC758 \uC120\uD0DD \uAC15\uC88C</p>';
    html += '</div>';

    html += '<div class="mypage-tabs">';
    html += '<div class="mypage-tab' + (state.mypageDay === 1 ? ' active' : '') + '" onclick="switchMypageDay(1)">Day 1 (4/11 \uD1A0)</div>';
    html += '<div class="mypage-tab' + (state.mypageDay === 2 ? ' active' : '') + '" onclick="switchMypageDay(2)">Day 2 (4/12 \uC77C)</div>';
    html += '</div>';

    html += renderMyPageDay(state.mypageDay);

    html += '<div class="overlap-legend">';
    html += '<span class="material-icons" style="font-size:16px; color:#dc2626;">warning</span>';
    html += ' <span class="overlap-legend-swatch"></span> = \uAC19\uC740 \uC2DC\uAC04\uB300 \uB2E4\uB978 Room \uC911\uBCF5 \uC120\uD0DD (\uB3D9\uC2DC \uC218\uAC15 \uBD88\uAC00)';
    html += '</div>';
    return html;
  }

  function switchMypageDay(d) { state.mypageDay = d; showView('mypage'); }

  function renderMyPageDay(dayNum) {
    if (!state.appData) return '';
    var slots = getOverviewSlots(dayNum);
    var grouped = groupSelectionsBySlot(dayNum, slots);
    var html = '<table class="my-table">';
    html += '<tr><th style="width:110px;">\uC138\uC158 \uC2DC\uAC04</th><th style="width:70px;">Room</th><th style="width:100px;">\uAC15\uC88C\uC2DC\uAC04</th><th>\uC8FC\uC81C</th><th style="width:150px;">\uC5F0\uC790/\uC18C\uC18D</th></tr>';

    if (slots.length === 0) {
      html += '<tr><td colspan="5" class="text-center py-8 text-gray-400">\uD574\uB2F9 \uC77C\uC815\uC774 \uC5C6\uC2B5\uB2C8\uB2E4.</td></tr></table>';
      return html;
    }

    var hasAny = false, totalOverlaps = 0;

    for (var s = 0; s < slots.length; s++) {
      var slot = slots[s];
      var lecs = grouped[slot.time] || [];

      if (lecs.length === 0) {
        html += '<tr class="slot-row" data-time="' + escHtml(slot.time) + '">';
        html += '<td>' + escHtml(slot.time) + '</td>';
        html += '<td colspan="4" class="text-gray-300 text-center">\u2014</td></tr>';
      } else {
        hasAny = true;
        var olIds = getOverlappingIds(lecs);
        var hasOL = Object.keys(olIds).length > 0;
        if (hasOL) { totalOverlaps++; html += '<tr class="overlap-group-start"><td colspan="5"></td></tr>'; }

        for (var l = 0; l < lecs.length; l++) {
          var lec = lecs[l];
          var isOL = olIds[lec.id] === true;
          html += '<tr class="' + (isOL ? 'overlap-row' : '') + '" data-time="' + escHtml(lec.time) + '">';
          if (l === 0) {
            html += '<td' + (lecs.length > 1 ? ' rowspan="' + lecs.length + '"' : '') + ' class="font-semibold text-primary-dark align-top">' + escHtml(slot.time) + '</td>';
          }
          var rbClass = 'room-badge';
          if (lec.room === 'Room 1') rbClass += ' room-1';
          else if (lec.room === 'Room 2') rbClass += ' room-2';
          else rbClass += ' room-common';
          html += '<td><span class="' + rbClass + '">' + escHtml(lec.room) + '</span></td>';
          html += '<td class="text-sm">' + escHtml(lec.time) + '</td>';
          html += '<td>' + escHtml(lec.title) + '</td>';
          html += '<td class="text-sm text-gray-500">' + escHtml(lec.speaker) + '</td></tr>';
        }
        if (hasOL) {
          html += '<tr class="overlap-group-end"><td colspan="5">';
          html += '<span class="material-icons" style="font-size:14px; color:#dc2626; vertical-align:middle;">warning</span>';
          html += ' <span class="text-xs text-red-600">\uC2DC\uAC04\uC774 \uACA8\uCE58\uB294 \uB2E4\uB978 Room \uAC15\uC88C\uAC00 \uC788\uC2B5\uB2C8\uB2E4. \uD558\uB098\uB97C \uC120\uD0DD\uD574\uC8FC\uC138\uC694.</span>';
          html += '</td></tr>';
        }
      }
    }

    if (!hasAny) {
      html += '<tr><td colspan="5" class="text-center py-4 text-gray-400 text-sm">\uC138\uC158 \uD398\uC774\uC9C0\uC5D0\uC11C \uAC15\uC88C\uB97C \uC120\uD0DD\uD574\uC8FC\uC138\uC694.</td></tr>';
    }
    html += '</table>';

    if (hasAny) {
      var olMsg = totalOverlaps > 0 ? ' | <span class="text-red-500">\u26A0 \uC2DC\uAC04 \uC911\uBCF5 ' + totalOverlaps + '\uAC74</span>' : '';
      html += '<p class="text-xs text-gray-400 mt-2 text-center">\uC120\uD0DD\uD55C \uAC15\uC88C: ' + state.selections.length + '\uAC1C' + olMsg + '</p>';
    }
    return html;
  }

  // 중복 감지 (반개구간)
  function getOverlappingIds(lectures) {
    var ids = {};
    if (lectures.length < 2) return ids;
    for (var i = 0; i < lectures.length; i++) {
      for (var j = i + 1; j < lectures.length; j++) {
        var a = lectures[i], b = lectures[j];
        if (a.room === b.room) continue;
        if (a.room === '\uACF5\uD1B5' || b.room === '\uACF5\uD1B5') continue;
        if (a.room === '\u2014' || b.room === '\u2014') continue;
        var ar = a.time.split(/[\u2013\-]/), br = b.time.split(/[\u2013\-]/);
        if (ar.length < 2 || br.length < 2) continue;
        var as = parseTime(ar[0]), ae = parseTime(ar[1]);
        var bs = parseTime(br[0]), be = parseTime(br[1]);
        if (!as || !ae || !bs || !be) continue;
        if (as.total < be.total && bs.total < ae.total) {
          ids[a.id] = true; ids[b.id] = true;
        }
      }
    }
    return ids;
  }

  // overview에서 세션 슬롯 추출
  function getOverviewSlots(dayNum) {
    var rows = state.appData.overview;
    var slots = [], inDay = false;
    for (var i = 0; i < rows.length; i++) {
      var c0 = (rows[i][0] || '').toString();
      var c1 = (rows[i][1] || '').toString();
      if (c0.indexOf('\uD83D\uDCC5 Day ' + dayNum) >= 0) { inDay = true; continue; }
      if (c0.indexOf('\uD83D\uDCC5 Day') >= 0 && inDay) break;
      if (!inDay) continue;
      if (c0 === '\uC2DC\uAC04' || !c0) continue;
      if (c0.indexOf('\uC77C\uC2DC:') === 0 || c0.indexOf('\uC0AC\uC804\uB4F1\uB85D\uBE44') === 0) continue;
      if (c1.indexOf('Session') >= 0 || c1.indexOf('\uB7F0\uCC9C') >= 0) {
        slots.push({ time: c0, label: c1 });
      }
    }
    return slots;
  }

  // 선택 강좌를 슬롯별로 그룹핑
  function groupSelectionsBySlot(dayNum, slots) {
    var grouped = {};
    var prefix = 'Day' + dayNum + '_';
    slots.forEach(function(sl) { grouped[sl.time] = []; });
    state.selections.forEach(function(selId) {
      if (selId.indexOf(prefix) !== 0) return;
      var ld = getLectureDataById(selId);
      if (!ld) return;
      var ms = findMatchingSlot(ld.time, slots);
      if (ms && grouped[ms]) grouped[ms].push(ld);
    });
    Object.keys(grouped).forEach(function(key) {
      grouped[key].sort(function(a, b) {
        var tc = a.time.localeCompare(b.time);
        if (tc !== 0) return tc;
        if (a.room === 'Room 1' && b.room === 'Room 2') return -1;
        if (a.room === 'Room 2' && b.room === 'Room 1') return 1;
        return 0;
      });
    });
    return grouped;
  }
