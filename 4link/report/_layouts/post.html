---
layout: default
---

<article>
    <h1>{{ page.title }}</h1>
    {% if page.date %}
    <div class="post-date">{{ page.date | date: "%Y년 %m월 %d일" }}</div>
    {% endif %}
    <hr>
    {{ content }}
</article>

<nav style="margin-top: 40px;">
    <a href="{{ site.baseurl }}/">← 목록으로 돌아가기</a>
</nav>
